name: Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/tools-for-frontend' }}
    
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      
      # Build client
      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build
      
      # Build server
      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Build server
        working-directory: server
        run: npm run build
      
      # Deploy to server
      - name: Deploy to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "client/dist/**,server/dist/**,server/package.json,server/package-lock.json,Caddyfile"
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 0

      - name: Restart services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            DEPLOY_PATH="${DEPLOY_PATH:-/var/www/tools-for-frontend}"
            cd "$DEPLOY_PATH"

            # Install production dependencies for server
            if [ -d "server" ]; then
              cd server
              npm ci --production
              
              # Restart server (using PM2 or systemd)
              # Option 1: PM2
              if pm2 list | grep -q "tools-for-frontend-server"; then
                pm2 restart tools-for-frontend-server
              else
                pm2 start "$DEPLOY_PATH/ecosystem.config.js"
              fi
            else
              echo "ERROR: server directory not found at $DEPLOY_PATH/server"
              exit 1
            fi

            # Reload Caddy
            cd "$DEPLOY_PATH"
            if [ -f "Caddyfile" ]; then
              sudo caddy reload --config "$DEPLOY_PATH/Caddyfile"
            else
              echo "ERROR: Caddyfile not found at $DEPLOY_PATH/Caddyfile"
              exit 1
            fi