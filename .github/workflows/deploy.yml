name: Deploy to Digital Ocean

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate SSH key format
        run: |
          if [ -z "${{ secrets.DROPLET_SSH_KEY }}" ]; then
            echo "Error: DROPLET_SSH_KEY secret is not set"
            exit 1
          fi
          
          # Check if key starts with BEGIN marker
          echo "${{ secrets.DROPLET_SSH_KEY }}" | head -1 | grep -q "BEGIN.*PRIVATE KEY" || {
            echo "Error: SSH key does not start with BEGIN marker"
            echo "Key should start with: -----BEGIN OPENSSH PRIVATE KEY----- or -----BEGIN RSA PRIVATE KEY-----"
            exit 1
          }
          
          # Check if key ends with END marker
          echo "${{ secrets.DROPLET_SSH_KEY }}" | tail -1 | grep -q "END.*PRIVATE KEY" || {
            echo "Error: SSH key does not end with END marker"
            echo "Key should end with: -----END OPENSSH PRIVATE KEY----- or -----END RSA PRIVATE KEY-----"
            exit 1
          }
          
          echo "SSH key format validation passed"

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.DROPLET_HOST }} >> ~/.ssh/known_hosts
          
      - name: Configure SSH for long-running commands
        run: |
          cat >> ~/.ssh/config << EOF
          Host ${{ secrets.DROPLET_HOST }}
            ServerAliveInterval 60
            ServerAliveCountMax 30
            TCPKeepAlive yes
            ConnectTimeout 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Test SSH connection
        run: |
          echo "Testing SSH connection to server..."
          if ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} "echo 'SSH connection successful'"; then
            echo "✓ SSH connection test passed"
          else
            echo "✗ SSH connection test failed"
            echo ""
            echo "Troubleshooting steps:"
            echo "1. Verify the public key is in ~/.ssh/authorized_keys on the server"
            echo "2. Check file permissions: chmod 600 ~/.ssh/authorized_keys"
            echo "3. Ensure SSH service is running on the server"
            echo "4. Verify DROPLET_USER and DROPLET_HOST secrets are correct"
            echo ""
            echo "To get your public key, run on your local machine:"
            echo "  ssh-keygen -y -f ~/.ssh/your_private_key"
            echo ""
            exit 1
          fi

      - name: Determine image tag
        id: image-tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Create deployment script
        run: |
          cat > deploy.sh << 'DEPLOY_SCRIPT'
          #!/bin/bash
          set -e
          
          # Navigate to project directory (try common locations)
          cd /opt/tools-for-frontend 2>/dev/null || \
          cd ~/tools-for-frontend 2>/dev/null || \
          cd ~/dev-tools 2>/dev/null || \
          { echo "Error: Could not find project directory"; exit 1; }
          
          echo "Current directory: $(pwd)"
          echo "IMAGE_REPO: $IMAGE_REPO"
          echo "IMAGE_TAG: $IMAGE_TAG"
          
          # Login to GitHub Container Registry
          echo "Logging in to GitHub Container Registry..."
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          
          # Set environment variables for docker-compose
          export IMAGE_REPO="$IMAGE_REPO"
          export IMAGE_TAG="$IMAGE_TAG"
          
          # Construct full image names
          BACKEND_IMAGE="ghcr.io/${IMAGE_REPO}/backend:${IMAGE_TAG}"
          CADDY_IMAGE="ghcr.io/${IMAGE_REPO}/caddy:${IMAGE_TAG}"
          
          echo "Checking if images exist in registry..."
          echo "Backend image: $BACKEND_IMAGE"
          echo "Caddy image: $CADDY_IMAGE"
          
          # Check if images exist before pulling
          if ! docker manifest inspect "$BACKEND_IMAGE" >/dev/null 2>&1; then
            echo "Error: Backend image $BACKEND_IMAGE not found in registry"
            echo "Please ensure the build-and-push workflow completed successfully"
            exit 1
          fi
          
          if ! docker manifest inspect "$CADDY_IMAGE" >/dev/null 2>&1; then
            echo "Error: Caddy image $CADDY_IMAGE not found in registry"
            echo "Please ensure the build-and-push workflow completed successfully"
            exit 1
          fi
          
          echo "Images found in registry, pulling..."
          # Pull images explicitly to ensure they're available
          echo "Pulling backend image..."
          docker pull "$BACKEND_IMAGE" || {
            echo "Error: Failed to pull backend image"
            exit 1
          }
          
          echo "Pulling caddy image..."
          docker pull "$CADDY_IMAGE" || {
            echo "Error: Failed to pull caddy image"
            exit 1
          }
          
          echo "Verifying images are available locally..."
          if ! docker image inspect "$BACKEND_IMAGE" >/dev/null 2>&1; then
            echo "Error: Backend image not found locally after pull"
            exit 1
          fi
          
          if ! docker image inspect "$CADDY_IMAGE" >/dev/null 2>&1; then
            echo "Error: Caddy image not found locally after pull"
            exit 1
          fi
          
          echo "Images pulled successfully"
          
          # Stop and remove old containers
          echo "Stopping old containers..."
          docker compose down
          
          # Start new containers (should use pulled images, not build)
          echo "Starting new containers..."
          docker compose up -d --no-build || {
            echo "Error: Failed to start containers"
            exit 1
          }
          
          # Clean up old images
          echo "Cleaning up old images..."
          docker image prune -f
          
          echo "Deployment completed successfully"
          DEPLOY_SCRIPT
          chmod +x deploy.sh

      - name: Copy deployment script to server
        run: |
          scp deploy.sh ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}:/tmp/deploy.sh

      - name: Execute deployment on server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE_REPO: ${{ github.repository }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          # Run deployment in background with proper output redirection to prevent SSH timeout issues
          echo "Starting deployment in background..."
          ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=30 ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
            "nohup bash -c 'GITHUB_TOKEN=\"$GITHUB_TOKEN\" GITHUB_ACTOR=\"$GITHUB_ACTOR\" IMAGE_REPO=\"$IMAGE_REPO\" IMAGE_TAG=\"$IMAGE_TAG\" bash /tmp/deploy.sh > /tmp/deploy.log 2>&1; echo \$? > /tmp/deploy.exit; rm /tmp/deploy.sh' > /tmp/deploy-start.log 2>&1 &"
          
          # Wait a moment for the process to start and log file to be created
          sleep 5
          
          # Monitor the deployment by polling the log file and process status
          echo "Monitoring deployment progress..."
          MAX_WAIT=1800  # 30 minutes max wait time
          ELAPSED=0
          INTERVAL=10     # Check every 10 seconds
          LAST_SIZE=0
          
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            # Check if deployment process is still running
            DEPLOY_RUNNING=$(ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=30 ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
              "pgrep -f '/tmp/deploy.sh' > /dev/null && echo 'yes' || echo 'no'" || echo "no")
            
            # Check if exit file exists (deployment finished)
            EXIT_FILE_EXISTS=$(ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=30 ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
              "test -f /tmp/deploy.exit && echo 'yes' || echo 'no'" || echo "no")
            
            if [ "$EXIT_FILE_EXISTS" = "yes" ]; then
              # Deployment finished
              echo "Deployment process completed"
              break
            elif [ "$DEPLOY_RUNNING" = "yes" ]; then
              # Deployment still running, show new log output
              CURRENT_SIZE=$(ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=30 ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
                "wc -c < /tmp/deploy.log 2>/dev/null || echo '0'")
              
              if [ "$CURRENT_SIZE" -gt "$LAST_SIZE" ]; then
                # New log content available, show it
                echo "Deployment in progress... (${ELAPSED}s elapsed)"
                ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=30 ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
                  "tail -n 10 /tmp/deploy.log 2>/dev/null | tail -c 500 || echo 'Waiting for log file...'"
                LAST_SIZE=$CURRENT_SIZE
              else
                echo "Deployment in progress... (${ELAPSED}s elapsed, no new output)"
              fi
              sleep $INTERVAL
              ELAPSED=$((ELAPSED + INTERVAL))
            else
              # Process not running and no exit file - might have crashed
              echo "Warning: Deployment process not found, checking for exit file..."
              sleep 2
              EXIT_FILE_EXISTS=$(ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=30 ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
                "test -f /tmp/deploy.exit && echo 'yes' || echo 'no'" || echo "no")
              if [ "$EXIT_FILE_EXISTS" = "no" ]; then
                echo "Error: Deployment process appears to have crashed"
                break
              fi
            fi
          done
          
          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "Error: Deployment timed out after ${MAX_WAIT} seconds"
            exit 1
          fi
          
          # Show final log output
          echo ""
          echo "=== Final Deployment Log ==="
          ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=30 ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
            "cat /tmp/deploy.log 2>/dev/null || echo 'Log file not found'"
          
          # Check exit status
          EXIT_CODE=$(ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=30 ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
            "cat /tmp/deploy.exit 2>/dev/null || echo '1'")
          
          if [ "$EXIT_CODE" = "0" ]; then
            echo ""
            echo "✓ Deployment completed successfully"
          else
            echo ""
            echo "✗ Deployment failed with exit code: $EXIT_CODE"
            exit 1
          fi

