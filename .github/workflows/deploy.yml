name: Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/tools-for-frontend' }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      
      # Build client
      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build
      
      # Build server
      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Build server
        working-directory: server
        run: npm run build
        
      - name: List build outputs
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Directory contents ==="
          ls -la
          echo "=== Client dist ==="
          ls -la client/dist || echo "client/dist not found"
          echo "=== Server dist ==="
          ls -la server/dist || echo "server/dist not found"
      
      # Deploy to server
      - name: Deploy to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "client/dist/**,server/dist/**,server/package.json,server/package-lock.json,Caddyfile"
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 0

      - name: Restart services
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd "$DEPLOY_PATH"
            
            # Debug: List what was copied
            echo "=== Contents of DEPLOY_PATH ==="
            ls -la
            echo "=== Checking server directory ==="
            ls -la server/ || echo "server directory not found"
            
            # Install production dependencies for server
            if [ -d "server" ]; then
              cd server
              
              # Check if package files exist
              if [ ! -f "package-lock.json" ]; then
                echo "ERROR: package-lock.json not found in server directory"
                exit 1
              fi
              
              npm ci --production
              
              # Restart server (using PM2 or systemd)
              # Option 1: PM2
              pm2 restart tools-for-frontend-server || pm2 start "$DEPLOY_PATH/server/dist/index.js" --name tools-for-frontend-server --cwd "$DEPLOY_PATH/server"
            else
              echo "ERROR: server directory not found at $DEPLOY_PATH/server"
              exit 1
            fi
            
            # Reload Caddy (go back to deploy path first)
            cd "$DEPLOY_PATH"
            if [ -f "Caddyfile" ]; then
              sudo caddy reload --config "$DEPLOY_PATH/Caddyfile"
            else
              echo "ERROR: Caddyfile not found at $DEPLOY_PATH/Caddyfile"
              exit 1
            fi