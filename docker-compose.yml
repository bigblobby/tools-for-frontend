
services:
  backend:
    # Use pre-built image from GitHub Container Registry
    # Set IMAGE_REPO environment variable (e.g., your-username/dev-tools)
    # Or uncomment the build section below for local development
    image: ghcr.io/${IMAGE_REPO:-bigblobby/tools-for-frontend}/backend:${IMAGE_TAG:-latest}
    # Uncomment below for local development/builds:
    # build:
    #   context: ./server
    #   dockerfile: Dockerfile
    container_name: tools-for-frontend-backend
    env_file:
      - ./server/.env
    # Environment variables from .env file will be loaded automatically
    # You can override them here if needed:
    # environment:
    #   - NODE_ENV=production
    #   - PORT=3001
    ports:
      - "3001:3001"
    networks:
      - tools-for-frontend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  caddy:
    # Use pre-built image from GitHub Container Registry
    # Set IMAGE_REPO environment variable (e.g., your-username/dev-tools)
    # Or uncomment the build section below for local development
    image: ghcr.io/${IMAGE_REPO:-bigblobby/tools-for-frontend}/caddy:${IMAGE_TAG:-latest}
    # Uncomment below for local development/builds:
    # build:
    #   context: .
    #   dockerfile: ./caddy/Dockerfile
    container_name: tools-for-frontend-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      - backend
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - tools-for-frontend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  tools-for-frontend-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
