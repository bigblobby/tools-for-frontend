services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
      # Reduce memory usage during build
      args:
        NODE_OPTIONS: "--max-old-space-size=512"
    container_name: tools-for-frontend-backend
    env_file:
      - ./server/.env
    # Environment variables from .env file will be loaded automatically
    # You can override them here if needed:
    # environment:
    #   - NODE_ENV=production
    #   - PORT=3001
    ports:
      - "3001:3001"
    networks:
      - tools-for-frontend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
      # Reduce memory usage during build
      args:
        NODE_OPTIONS: "--max-old-space-size=512"
    container_name: tools-for-frontend-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - tools-for-frontend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  certbot:
    image: certbot/certbot:latest
    container_name: tools-for-frontend-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Certbot runs in the background and checks for renewal every 12 hours
    # For automatic nginx reload after renewal, set up a cron job on the host:
    # 0 3 * * * cd /path/to/project && ./scripts/renew-certs.sh
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - tools-for-frontend-network
    restart: unless-stopped

networks:
  tools-for-frontend-network:
    driver: bridge
