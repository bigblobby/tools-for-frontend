server {
    listen 80;
    server_name _;

    # Resolver for dynamic upstream resolution
    resolver 127.0.0.11 valid=30s;

    # Increase body size limit for file uploads
    client_max_body_size 10M;

    # Serve static files from client build
    root /usr/share/nginx/html;
    index index.html;

    # Placeholder image route - proxy to backend API
    location /placeholder {
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream/api/image/placeholder;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache placeholder images
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000";
    }

    # API routes - proxy to backend
    location /api {
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (if needed in future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Serve static assets with caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Handle client-side routing - return index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
